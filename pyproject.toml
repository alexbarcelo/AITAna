[project]
name = "aitana"
version = "0.1.0"
description = "Automatic first-pass grading of hands-on lab answer sheets (PDF, Jupyter notebooks) -- FastAPI + MongoDB + MinIO + Celery"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "langchain>=1.3.14",
    "langchain-ollama>=1.1.0",
    "langchain-openai>=1.4.1",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.7.0",
    "pypdf>=6.14.2",
    "python-dotenv>=1.2.2",
    "pyyaml>=6.0.3",
    "fastapi>=0.118.0",
    "uvicorn[standard]>=0.34.0",
    "python-multipart>=0.0.20",
    "beanie>=1.29.0",
    "pymongo>=4.15.0",
    "celery>=5.4.0",
    "redis>=5.2.0",
    "minio>=7.2.12",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.25.0",
    "httpx>=0.28.0",
    "mongomock-motor>=0.0.35",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aitana"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
