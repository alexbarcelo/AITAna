services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: aitana
      POSTGRES_PASSWORD: aitana
      POSTGRES_DB: aitana
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aitana -d aitana"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Database GUI in the browser, preconfigured for the postgres service.
  dbgate:
    image: dbgate/dbgate
    ports:
      - 8081:3000
    environment:
      CONNECTIONS: pg
      LABEL_pg: PostgreSQL
      SERVER_pg: postgres
      PORT_pg: 5432
      USER_pg: aitana
      PASSWORD_pg: aitana
      DATABASE_pg: aitana
      ENGINE_pg: postgres@dbgate-plugin-postgres
    depends_on:
      - postgres

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine

  api:
    build: .
    env_file: .env
    ports:
      - "8080:8080"
    volumes:
      - ./src:/app/src
      - ./configs:/app/configs
    # Migrations first: the schema is owned by Alembic, never created by the app.
    command: ["sh", "-c", "alembic upgrade head && exec uvicorn aitana.api.main:app --host 0.0.0.0 --port 8080 --reload"]
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started
      redis:
        condition: service_started
      gotenberg:
        condition: service_started

  # .docx -> PDF conversion (LibreOffice behind an HTTP API), only called by
  # the API at upload time. Port published for a host-run API, like the others.
  gotenberg:
    image: gotenberg/gotenberg:8

  worker:
    build: .
    env_file: .env
    volumes:
      - ./src:/app/src
      - ./configs:/app/configs
    command: ["celery", "-A", "aitana.worker.celery_app.celery_app", "worker", "--loglevel=info"]
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started
      redis:
        condition: service_started

  frontend:
    build:
      context: ./frontend
      target: dev
    ports:
      - "5173:5173"
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/index.html:/app/index.html
    environment:
      VITE_API_URL: http://localhost:8080
    depends_on:
      - api

volumes:
  postgres_data:
  minio_data:
