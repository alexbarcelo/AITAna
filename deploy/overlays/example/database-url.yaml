# Points the app at the CloudNativePG cluster (postgres-cluster.yaml): the
# operator-generated `aitana-db-app` Secret's `uri` becomes DATABASE_URL.
# An explicit `env` entry wins over the `envFrom` Secret/ConfigMap, so this
# needs no DATABASE_URL in `aitana-secrets`. The app accepts the
# `postgresql://` URI as is.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aitana-api
spec:
  template:
    spec:
      initContainers:
        - name: migrate
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef: {name: aitana-db-app, key: uri}
      containers:
        - name: api
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef: {name: aitana-db-app, key: uri}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aitana-worker
spec:
  template:
    spec:
      containers:
        - name: worker
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef: {name: aitana-db-app, key: uri}
