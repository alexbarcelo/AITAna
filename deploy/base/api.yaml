apiVersion: apps/v1
kind: Deployment
metadata:
  name: aitana-api
  labels:
    app.kubernetes.io/name: aitana-api
spec:
  # Startup steps (migrations, model seeding, ensure_bucket) are idempotent,
  # and concurrent migrations serialize on an advisory lock, so more
  # replicas are safe.
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: aitana-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: aitana-api
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      # Schema migrations run before the API starts serving (Alembic; holds a
      # PostgreSQL advisory lock, so concurrent replicas migrate one at a time).
      initContainers:
        - name: migrate
          image: aitana-api
          command: ["alembic", "upgrade", "head"]
          envFrom:
            - configMapRef:
                name: aitana-config
            - secretRef:
                name: aitana-secrets
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
      containers:
        - name: api
          image: aitana-api
          command: ["uvicorn", "aitana.api.main:app", "--host", "0.0.0.0", "--port", "8080", "--proxy-headers", "--forwarded-allow-ips", "*"]
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: aitana-config
            - secretRef:
                name: aitana-secrets
          # Lifespan connects to PostgreSQL/S3 before serving.
          startupProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 20
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 384Mi
            limits:
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
---
apiVersion: v1
kind: Service
metadata:
  name: aitana-api
  labels:
    app.kubernetes.io/name: aitana-api
spec:
  selector:
    app.kubernetes.io/name: aitana-api
  ports:
    - name: http
      port: 8080
      targetPort: http
