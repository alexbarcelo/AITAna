# Celery broker/result backend only. No persistence: a restart loses queued
# tasks, which then need a manual regrade -- acceptable for this volume.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aitana-redis
  labels:
    app.kubernetes.io/name: aitana-redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: aitana-redis
  template:
    metadata:
      labels:
        app.kubernetes.io/name: aitana-redis
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: redis
          image: redis:7-alpine
          args: ["--save", "", "--appendonly", "no"]
          ports:
            - name: redis
              containerPort: 6379
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            periodSeconds: 10
          livenessProbe:
            tcpSocket: {port: redis}
            periodSeconds: 20
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: aitana-redis
  labels:
    app.kubernetes.io/name: aitana-redis
spec:
  selector:
    app.kubernetes.io/name: aitana-redis
  ports:
    - name: redis
      port: 6379
      targetPort: redis
