# .docx -> PDF conversion (LibreOffice behind an HTTP API), called only by
# the api at upload time. Stateless.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aitana-gotenberg
  labels:
    app.kubernetes.io/name: aitana-gotenberg
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: aitana-gotenberg
  template:
    metadata:
      labels:
        app.kubernetes.io/name: aitana-gotenberg
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: gotenberg
          image: gotenberg/gotenberg:8
          ports:
            - name: http
              containerPort: 3000
          readinessProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 20
            timeoutSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
---
apiVersion: v1
kind: Service
metadata:
  name: aitana-gotenberg
  labels:
    app.kubernetes.io/name: aitana-gotenberg
spec:
  selector:
    app.kubernetes.io/name: aitana-gotenberg
  ports:
    - name: http
      port: 3000
      targetPort: http
