# Alembic configuration. The database URL is not here: migrations/env.py
# reads it from the app settings (DATABASE_URL), same as the app itself.
# Usage: `alembic upgrade head` (from the repo root, or /app in the image).

[alembic]
script_location = %(here)s/src/aitana/migrations
prepend_sys_path = .
path_separator = os
file_template = %%(rev)s_%%(slug)s

# Run new revisions (`alembic revision --autogenerate`) through Ruff, so they
# match the rest of the code (pyproject.toml's [tool.ruff]). Dev-only: ruff is
# a dev dependency, and hooks only run when a revision file is written.
[post_write_hooks]
hooks = ruff_fix, ruff_format
ruff_fix.type = module
ruff_fix.module = ruff
ruff_fix.options = check --fix REVISION_SCRIPT_FILENAME
ruff_format.type = module
ruff_format.module = ruff
ruff_format.options = format REVISION_SCRIPT_FILENAME

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
